<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />
<section class="uni-hero" data-tone="${configuration.tone!'purple'}">
	<div class="uni-hero__inner">
		<h1 class="uni-hero__title" data-lfr-editable-id="title" data-lfr-editable-type="text">
			Your headline goes here
		</h1>

		<div class="uni-hero__text" data-lfr-editable-id="text" data-lfr-editable-type="rich-text">
			<p>
				One or two short sentences that tell visitors why they should stay.
			</p>
		</div>

		<a class="uni-hero__cta" data-lfr-editable-id="cta" data-lfr-editable-type="link" href="" id="fragment-${fragmentEntryLinkNamespace}-cta">
			Get started
		</a>
	</div>
</section>
