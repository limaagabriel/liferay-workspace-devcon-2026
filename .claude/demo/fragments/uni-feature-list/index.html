<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />
<section class="uni-feature-list">
	<div class="uni-feature-list__inner">
		<div class="uni-feature-list__stats">
			<div class="uni-feature-list__stat">
				<span class="uni-feature-list__stat-value" data-lfr-editable-id="stat-1" data-lfr-editable-type="text">100+</span>
				<span class="uni-feature-list__stat-label" data-lfr-editable-id="stat-1-label" data-lfr-editable-type="text">First key number</span>
			</div>

			<div class="uni-feature-list__stat">
				<span class="uni-feature-list__stat-value" data-lfr-editable-id="stat-2" data-lfr-editable-type="text">95%</span>
				<span class="uni-feature-list__stat-label" data-lfr-editable-id="stat-2-label" data-lfr-editable-type="text">Second key number</span>
			</div>

			<div class="uni-feature-list__stat">
				<span class="uni-feature-list__stat-value" data-lfr-editable-id="stat-3" data-lfr-editable-type="text">10</span>
				<span class="uni-feature-list__stat-label" data-lfr-editable-id="stat-3-label" data-lfr-editable-type="text">Third key number</span>
			</div>
		</div>

		<div class="uni-feature-list__content">
			<h2 class="uni-feature-list__title" data-lfr-editable-id="title" data-lfr-editable-type="text">
				A title for this list
			</h2>

			<div class="uni-feature-list__intro" data-lfr-editable-id="intro" data-lfr-editable-type="rich-text">
				<p>
					One sentence that introduces the points below.
				</p>
			</div>

			<div class="uni-feature-list__item">
				<span aria-hidden="true" class="uni-icon uni-icon--circle"></span>

				<div>
					<h3 class="uni-feature-list__item-title" data-lfr-editable-id="item-1-title" data-lfr-editable-type="text">First point</h3>

					<div class="uni-feature-list__item-text" data-lfr-editable-id="item-1-text" data-lfr-editable-type="rich-text">
						<p>
							A short explanation.
						</p>
					</div>
				</div>
			</div>

			<div class="uni-feature-list__item">
				<span aria-hidden="true" class="uni-icon uni-icon--diamond"></span>

				<div>
					<h3 class="uni-feature-list__item-title" data-lfr-editable-id="item-2-title" data-lfr-editable-type="text">Second point</h3>

					<div class="uni-feature-list__item-text" data-lfr-editable-id="item-2-text" data-lfr-editable-type="rich-text">
						<p>
							A short explanation.
						</p>
					</div>
				</div>
			</div>

			<div class="uni-feature-list__item">
				<span aria-hidden="true" class="uni-icon uni-icon--triangle"></span>

				<div>
					<h3 class="uni-feature-list__item-title" data-lfr-editable-id="item-3-title" data-lfr-editable-type="text">Third point</h3>

					<div class="uni-feature-list__item-text" data-lfr-editable-id="item-3-text" data-lfr-editable-type="rich-text">
						<p>
							A short explanation.
						</p>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
