<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />
<div class="uni-feature-trio" data-overlap="${configuration.overlap!'yes'}">
	<div class="uni-feature-trio__card">
		<div class="uni-feature-trio__grid">
			<div class="uni-feature-trio__item">
				<span aria-hidden="true" class="uni-icon uni-icon--circle"></span>

				<h3 class="uni-feature-trio__title" data-lfr-editable-id="title-1" data-lfr-editable-type="text">
					First feature
				</h3>

				<div class="uni-feature-trio__text" data-lfr-editable-id="text-1" data-lfr-editable-type="rich-text">
					<p>
						A short sentence about this feature.
					</p>
				</div>
			</div>

			<div class="uni-feature-trio__item">
				<span aria-hidden="true" class="uni-icon uni-icon--diamond"></span>

				<h3 class="uni-feature-trio__title" data-lfr-editable-id="title-2" data-lfr-editable-type="text">
					Second feature
				</h3>

				<div class="uni-feature-trio__text" data-lfr-editable-id="text-2" data-lfr-editable-type="rich-text">
					<p>
						A short sentence about this feature.
					</p>
				</div>
			</div>

			<div class="uni-feature-trio__item">
				<span aria-hidden="true" class="uni-icon uni-icon--triangle"></span>

				<h3 class="uni-feature-trio__title" data-lfr-editable-id="title-3" data-lfr-editable-type="text">
					Third feature
				</h3>

				<div class="uni-feature-trio__text" data-lfr-editable-id="text-3" data-lfr-editable-type="rich-text">
					<p>
						A short sentence about this feature.
					</p>
				</div>
			</div>
		</div>

		<div class="uni-feature-trio__footer">
			<h3 class="uni-feature-trio__footer-title" data-lfr-editable-id="footer-title" data-lfr-editable-type="text">
				A closing statement
			</h3>

			<div class="uni-feature-trio__footer-text" data-lfr-editable-id="footer-text" data-lfr-editable-type="rich-text">
				<p>
					One or two sentences that sum up the three features above.
				</p>
			</div>
		</div>
	</div>
</div>
